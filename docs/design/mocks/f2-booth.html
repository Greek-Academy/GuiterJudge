<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0F12">
<title>深夜のブース — ギター上達診断(F2 モック)</title>
<style>
/* ============ 色(2 段: 役割 → 値)============ */
:root{
  --room:#0E0F12; --wall:#1C1E24; --wall-2:#24262D; --wall-3:#2C2E36;
  --hair:rgba(232,228,220,.07);
  --text:#E8E4DC; --text-2:#B7B2A8; --text-3:#9A958C;
  --now:#FFB862; --now-ink:#221507; --now-fill:#FFB862; --now-glow:rgba(255,184,98,.38);
  --prev:#9A958C; --prev-mark:#6E6A62;
  --air:#FF4A3D; --vu:#F2A93B;
  --band:rgba(232,228,220,.11); --band-edge:rgba(232,228,220,.22);
  --pool:rgba(255,184,98,.20); --pool-2:rgba(255,184,98,.06);
  --vu-face-1:#2A2621; --vu-face-2:#15161A; --vu-tick:#F2A93B; --vu-label:#E2B472;
  --scrim:rgba(4,5,7,.72);
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --font:"Manrope","Avenir Next","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,"Hiragino Sans",monospace;
  color-scheme:dark;
}
html[data-theme="light"]{
  --room:#F2EFE9; --wall:#FFFFFF; --wall-2:#F7F4EE; --wall-3:#ECE7DE;
  --hair:rgba(27,26,24,.08);
  --text:#1B1A18; --text-2:#4E4A44; --text-3:#6E6A62;
  --now:#9A5217; --now-ink:#FFFFFF; --now-fill:#9A5217; --now-glow:rgba(184,98,27,.18);
  --prev:#6E6A62; --prev-mark:#9A958C;
  --band:rgba(27,26,24,.07); --band-edge:rgba(27,26,24,.18);
  --pool:rgba(255,184,98,.34); --pool-2:rgba(255,184,98,.10);
  --vu-face-1:#FBF3E1; --vu-face-2:#EFE3C8; --vu-tick:#7A4A10; --vu-label:#6B400C;
  --scrim:rgba(27,26,24,.45);
  --shadow:0 18px 40px rgba(60,40,20,.14);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--room);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overflow-x:hidden;font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible,a:focus-visible{outline:2px solid var(--now);outline-offset:3px;border-radius:12px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.mono{font-family:var(--mono);letter-spacing:.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{min-height:100dvh;position:relative}
.screen{min-height:100dvh;position:relative;animation:fadeIn .28s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 楽屋の共通部品 ============ */
.room{padding:0 16px calc(120px + env(safe-area-inset-bottom));
  background:
    radial-gradient(120% 60% at 50% -10%, var(--pool-2), transparent 60%),
    var(--room)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px;padding-top:4px}
.back{display:inline-flex;align-items:center;gap:4px;height:48px;padding:0 14px 0 8px;margin-left:-8px;border-radius:24px;font-size:16px;font-weight:600;color:var(--text-2)}
.back:active{background:var(--wall)}
.back svg{width:22px;height:22px}
.slate{font-family:var(--mono);font-size:13px;letter-spacing:.16em;color:var(--text-3);text-transform:uppercase}
.slate b{color:var(--text-2);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:22px;background:var(--wall);font-size:15px;font-weight:600;color:var(--text-2)}
.pill:active{background:var(--wall-2)}
.face{background:var(--wall);border-radius:20px}
.label{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--text-3)}
.note{font-size:13px;line-height:1.6;color:var(--text-3)}
.note b{color:var(--text-2);font-weight:600}
.gloss{font-size:12.5px;color:var(--text-3);font-weight:500;letter-spacing:0}
.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 10px}
.section-h h2{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--text-2)}

/* 目盛りゲージ(安定ゲージ 5 目盛り) */
.gauge{display:inline-flex;gap:4px;vertical-align:middle}
.gauge i{width:22px;height:8px;border-radius:3px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--prev-mark)}
.gauge i.on{background:var(--text-2);box-shadow:none}
.gauge.sm i{width:12px;height:6px;border-radius:2px}

/* 主ボタン(暖色の光) */
.btn-rec{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:72px;border-radius:36px;
  background:var(--now-fill);color:var(--now-ink);font-size:21px;font-weight:700;letter-spacing:.02em;
  box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 10px 34px var(--now-glow)}
.btn-rec:active{transform:scale(.985)}
.btn-rec .dot{width:16px;height:16px;border-radius:50%;background:#D8281B;box-shadow:0 0 0 3px rgba(34,21,7,.18)}
html[data-theme="light"] .btn-rec .dot{background:#FF5A4C;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.btn-2{display:flex;align-items:center;justify-content:center;gap:8px;height:64px;border-radius:32px;background:var(--wall-2);font-size:17px;font-weight:600;color:var(--text)}
.btn-2:active{background:var(--wall-3)}
.btn-3{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:22px;background:var(--wall-2);font-size:14.5px;font-weight:600;color:var(--text)}
.btn-3:active{background:var(--wall-3)}
.btn-3[disabled]{opacity:.55}

/* 下に固定する操作バー */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 16px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--room) 62%,transparent);display:flex;gap:10px}
.dock .btn-rec{flex:1.7}
.dock .btn-2{flex:1;height:72px;border-radius:36px}

/* ============ ホーム(セッションシート) ============ */
.greet{margin:6px 4px 14px;font-size:15px;color:var(--text-2)}
.hero{position:relative;overflow:hidden;padding:22px 20px 20px;border-radius:24px;
  background:
    radial-gradient(90% 70% at 50% 0%, var(--pool), transparent 70%),
    radial-gradient(60% 40% at 50% 8%, var(--pool-2), transparent 80%),
    var(--wall)}
.hero::before{content:"";position:absolute;left:50%;top:-40px;width:180px;height:60px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,214,160,.55),transparent);filter:blur(6px);pointer-events:none}
html[data-theme="light"] .hero::before{background:radial-gradient(closest-side,rgba(255,190,110,.55),transparent)}
.hero-top{display:flex;justify-content:space-between;align-items:center}
.today-tag{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--now)}
.armed{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);font-weight:600}
.armed i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--text-2)}
.armed i::after{content:"";display:block;width:4px;height:4px;margin:2px;border-radius:50%;background:var(--text-2)}
.hero .tr{font-family:var(--mono);font-size:15px;letter-spacing:.14em;color:var(--text-3);margin-top:18px}
.hero h1{font-size:27px;line-height:1.3;font-weight:700;letter-spacing:.01em;margin-top:2px}
.hero .sub{font-size:15px;color:var(--text-2);margin-top:4px}
.hero-stat{display:flex;align-items:flex-end;justify-content:space-between;margin:22px 0 18px;gap:12px}
.hero-stat .lbl{font-size:14px;color:var(--text-2);line-height:1.5}
.hero-stat .lbl .mono{font-size:13px;color:var(--text-3)}
.bignum{font-weight:300;letter-spacing:-.02em;line-height:.9}
.hero-stat .bignum{font-size:60px;color:var(--text)}
.hero-stat .unit{font-size:18px;color:var(--text-2);margin-left:4px;font-weight:500}
.hero-gauge{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-2);padding:12px 0 18px;border-top:1px solid var(--hair)}
.hero-gauge .note{margin-left:auto}
.hero .under{margin-top:10px;text-align:center;font-size:13px;color:var(--text-3)}

.tracks{border-radius:20px;background:var(--wall);overflow:hidden}
.trow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px;width:100%;min-height:68px;padding:10px 16px;text-align:left;color:var(--text-2)}
.trow + .trow{box-shadow:0 -1px 0 var(--hair)}
.trow:active{background:var(--wall-2)}
.trow .no{font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--text-3)}
.trow .nm{font-size:16px;font-weight:600;color:var(--text-2);line-height:1.35}
.trow .meta{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:12.5px;color:var(--text-3)}
.trow .ms{text-align:right;font-size:20px;font-weight:400;color:var(--text-2)}
.trow .ms small{font-size:12px;color:var(--text-3);margin-left:2px}
.trow .ms .when{display:block;font-size:12.5px;color:var(--text-3);font-weight:500}
.ok-row{display:flex;align-items:center;justify-content:space-between;width:100%;height:60px;padding:0 18px;margin-top:10px;border-radius:18px;background:var(--wall);color:var(--text-2);font-size:15px;font-weight:600}
.ok-row .stamp{font-family:var(--mono);font-size:11px;letter-spacing:.14em;padding:3px 7px;border-radius:5px;box-shadow:inset 0 0 0 1.5px var(--text-3);color:var(--text-2);margin-right:10px}
.home-foot{margin:22px 6px 0}

/* ============ トラック(フレーズ) ============ */
.ph-title .tr{font-family:var(--mono);font-size:14px;letter-spacing:.14em;color:var(--text-3)}
.ph-title h1{font-size:25px;line-height:1.3;font-weight:700}
.ph-title .sub{font-size:14.5px;color:var(--text-2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.chip{display:inline-flex;align-items:center;height:40px;padding:0 14px;border-radius:20px;background:var(--wall);font-size:14.5px;font-weight:600;color:var(--text-2)}
.chip.act{color:var(--text)}
.chip.act svg{width:16px;height:16px;margin-right:6px}
.sheet-card{margin-top:16px;padding:6px 6px 8px;border-radius:20px;background:var(--wall)}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;padding:12px 12px 8px}
.sheet-head h2{font-size:16px;font-weight:700}
.tk{display:grid;grid-template-columns:44px 42px 1fr 46px 40px 44px 40px;align-items:center;gap:0;min-height:52px;padding:0 4px 0 10px;border-radius:14px}
.tk.hd{min-height:26px;font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.02em}
.tk.hd span{white-space:nowrap}
.tk.row + .tk.row{box-shadow:0 -1px 0 var(--hair)}
.tk.latest{background:var(--wall-2);box-shadow:none!important}
.tk .t{font-family:var(--mono);font-size:15px;font-weight:500;color:var(--text)}
.tk .d{font-size:13.5px;color:var(--text-3)}
.tk .v{font-size:17px;color:var(--text);text-align:right;padding-right:10px}
.tk .v small{font-size:11.5px;color:var(--text-3);margin-left:1px}
.tk .m,.tk .x{font-size:15px;color:var(--text-2);text-align:right;padding-right:8px}
.tk .ib{width:40px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--text-2)}
.tk .ib:active{background:var(--wall-3)}
.tk .ib svg{width:18px;height:18px}
.tk .base{display:block;font-family:var(--font);font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--text-3);margin-top:-2px}
.trend{margin-top:14px;padding:16px 16px 14px;border-radius:20px;background:var(--wall)}
.trend h2,.ref h2{font-size:16px;font-weight:700}
.trend svg{display:block;width:100%;height:auto;margin-top:8px}
.ref{margin-top:14px;padding:16px;border-radius:20px;background:var(--wall)}
.ref-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ok-take{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border-radius:20px;background:var(--wall);font-size:14.5px;color:var(--text-2)}
.ok-take .btn-3{margin-left:auto}

/* toast(捨てた直後 5 秒) */
.toast{position:fixed;left:16px;right:16px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-radius:18px;background:var(--wall-3);box-shadow:var(--shadow);font-size:14.5px;color:var(--text);overflow:hidden;animation:toastIn .25s ease both}
html[data-theme="light"] .toast{background:#2A2825;color:#F2EFE9}
html[data-theme="light"] .toast .btn-3{background:#3A3834;color:#FFD9A8}
.toast .btn-3{margin-left:auto;background:var(--wall);color:var(--now)}
.toast .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--now);animation:shrink 5s linear forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shrink{from{width:100%}to{width:0}}

/* ボトムシート */
.scrim{position:fixed;inset:0;z-index:50;background:var(--scrim);animation:fadeIn .2s ease both}
.bsheet{position:fixed;left:0;right:0;bottom:0;z-index:51;padding:10px 16px calc(20px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:var(--wall);box-shadow:var(--shadow);animation:up .26s cubic-bezier(.2,.8,.2,1) both}
.bsheet .grab{width:40px;height:5px;border-radius:3px;background:var(--wall-3);margin:0 auto 14px}
.bsheet h3{font-size:18px;font-weight:700;padding:0 4px}
.bsheet .sub{font-size:13.5px;color:var(--text-3);padding:2px 4px 10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:0 12px;border-radius:16px;text-align:left;font-size:16px;font-weight:600}
.opt:active{background:var(--wall-2)}
.opt .ic{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--wall-2);font-size:16px;color:var(--text-2)}
.opt small{display:block;font-size:12.5px;font-weight:500;color:var(--text-3)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.seg{display:flex;padding:4px;border-radius:16px;background:var(--wall-2);gap:4px}
.seg button{flex:1;height:44px;border-radius:12px;font-size:14.5px;font-weight:600;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--wall);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 8px rgba(0,0,0,.25)}
html[data-theme="light"] .seg button[aria-pressed="true"]{box-shadow:0 1px 4px rgba(0,0,0,.12)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px}
.set-row + .set-row{border-top:1px solid var(--hair)}
.set-row .k{font-size:15px;font-weight:600}
.set-row .k small{display:block;font-size:12.5px;color:var(--text-3);font-weight:500}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;border-radius:24px;background:var(--wall-2);font-size:22px;color:var(--text)}
.stepper output{min-width:74px;text-align:center;font-size:22px;font-weight:400}
/* ============ ブース(常に黒、OLED) ============ */
html.booth,html.booth body{background:#000}
.booth-s{position:relative;min-height:100dvh;height:100dvh;overflow:hidden;background:#000;color:#F3EFE7;display:flex;flex-direction:column;align-items:center;
  padding:calc(12px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;touch-action:none}
.booth-s .haze{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 40% at 50% 6%,rgba(255,74,61,.20),transparent 70%);transition:opacity .6s}
.booth-s .haze.off{opacity:0}
.booth-s .warmhaze{position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 36% at 50% 42%,rgba(255,184,98,.13),transparent 72%);opacity:0;transition:opacity 1.2s ease}
.booth-s .warmhaze.on{opacity:1}
.b-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;width:100%;height:72px}
.b-x{width:64px;height:64px;margin-left:-8px;border-radius:32px;display:flex;align-items:center;justify-content:center;color:#9A958C}
.b-x svg{width:34px;height:34px}
.b-x:active{background:#161616}
.b-time{font-family:var(--mono);font-size:40px;font-weight:400;color:#B7B2A8;letter-spacing:.02em}
.onair{position:relative;z-index:2;display:inline-flex;align-items:center;gap:14px;height:72px;padding:0 26px;margin-top:6px;border-radius:14px;
  font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:.12em;background:#FF4A3D;color:#2A0806;
  box-shadow:0 0 0 2px rgba(255,120,100,.35) inset,0 0 26px rgba(255,74,61,.75),0 0 90px rgba(255,74,61,.45)}
.onair i{width:18px;height:18px;border-radius:50%;background:#2A0806}
.onair.standby{background:#1A0A09;color:#B7847D;box-shadow:0 0 0 2px #4A1B17 inset}
.onair.standby i{background:#7A2C25}
.b-slate{position:relative;z-index:2;margin-top:26px;font-family:var(--mono);font-size:32px;letter-spacing:.08em;color:#B7B2A8}
.b-slate b{color:#F3EFE7;font-weight:500}
.b-big{position:relative;z-index:2;font-size:220px;line-height:1;font-weight:200;letter-spacing:-.04em;color:#F3EFE7;margin-top:10px;height:230px;display:flex;align-items:center}
.b-big.count{color:#F2A93B;text-shadow:0 0 40px rgba(242,169,59,.45)}
.b-big.tick{animation:tick .22s ease-out}
@keyframes tick{from{transform:scale(1.06);opacity:.75}to{transform:none;opacity:1}}
.b-line{position:relative;z-index:2;font-size:32px;font-weight:500;color:#B7B2A8;height:48px}
.beats{position:relative;z-index:2;display:flex;align-items:center;gap:30px;margin-top:22px;height:48px}
.beats i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px #4A4640;transition:background .08s,box-shadow .08s}
.beats i.one{width:34px;height:34px}
.beats i.lit{background:#F2A93B;box-shadow:0 0 0 2px #F2A93B inset,0 0 22px rgba(242,169,59,.8),0 0 60px rgba(242,169,59,.35)}
.beats i.lit.fade{transition:background .35s ease-out,box-shadow .35s ease-out}
.b-bpm{position:relative;z-index:2;margin-top:18px;font-family:var(--mono);font-size:36px;color:#B7B2A8}
.b-hint{position:relative;z-index:2;margin-top:auto;font-size:32px;font-weight:500;color:#9A958C;text-align:center;line-height:1.3}
.b-hint small{display:block;font-size:32px}
/* ブース直後 */
.after-talk{position:relative;z-index:2;margin-top:34px;font-size:32px;font-weight:500;color:#B7B2A8;height:46px}
.after-num{position:relative;z-index:2;display:flex;align-items:baseline;gap:10px;margin-top:6px;height:220px}
.after-num .n{font-size:210px;line-height:1;font-weight:200;letter-spacing:-.05em;color:#FFB862;
  text-shadow:0 0 18px rgba(255,184,98,.55),0 0 70px rgba(255,184,98,.28)}
.after-num .u{font-size:48px;font-weight:400;color:#FFB862;opacity:.9}
.after-num.wait .n,.after-num.wait .u{opacity:0}
.after-num.glow .n,.after-num.glow .u{animation:glowIn .85s cubic-bezier(.2,.7,.2,1) both}
@keyframes glowIn{0%{opacity:0;filter:blur(14px);text-shadow:0 0 0 rgba(255,184,98,0)}55%{opacity:1;filter:blur(2px)}100%{opacity:1;filter:none}}
.analyzing{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:32px;color:#9A958C;opacity:0;transition:opacity .2s}
.after-num.wait .analyzing{opacity:1}
.analyzing span{display:inline-block;animation:blink 1s infinite}
.analyzing span:nth-child(2){animation-delay:.2s}.analyzing span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.25}}
.after-prev{position:relative;z-index:2;font-size:44px;font-weight:300;color:#9A958C;margin-top:4px}
.after-prev .mono{font-size:30px}

<script>
/* =========================================================

const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------- アイコン ---------- */
const I = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',

  more: '<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></g></svg>',

/* ---------- VU メーター(SVG、0〜40ms の線形目盛り) ---------- */
const VU = { cx: 80, cy: 102, R: 72, min: -50, max: 50, top: 40 };
const vuAngle = v => VU.min + (Math.max(0, Math.min(VU.top, v)) / VU.top) * (VU.max - VU.min);
function vuPt(r, v){ const a = vuAngle(v) * Math.PI / 180; return [VU.cx + r * Math.sin(a), VU.cy - r * Math.cos(a)]; }
function vuSVG({ id, value, kind, ghost = null, band = null, label }){
  const { cx, cy, R } = VU;
  let ticks = '';
  for (let v = 0; v <= 40; v += 2){
    const major = v % 10 === 0;
    const [x1, y1] = vuPt(R - (major ? 11 : 6), v), [x2, y2] = vuPt(R, v);
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--vu-tick)" stroke-width="${major ? 1.7 : 1}" stroke-linecap="round" opacity="${major ? 1 : .8}"/>`;
    if (major){ const [lx, ly] = vuPt(R + 10, v); ticks += `<text x="${lx.toFixed(1)}" y="${(ly + 3.5).toFixed(1)}" text-anchor="middle" font-family="IBM Plex Mono,ui-monospace,Menlo,monospace" font-size="10" fill="var(--vu-label)">${v}</text>`; }
  }
  const arcR = R - 2;
  const [ax, ay] = vuPt(arcR, 0), [bx, by] = vuPt(arcR, 40);
  let bandSvg = '';
  if (band){
    const br = R - 18; const [p1x, p1y] = vuPt(br, band[0]), [p2x, p2y] = vuPt(br, band[1]);
    bandSvg = `<path d="M${p1x.toFixed(1)} ${p1y.toFixed(1)} A${br} ${br} 0 0 1 ${p2x.toFixed(1)} ${p2y.toFixed(1)}" fill="none" stroke="var(--band-edge)" stroke-width="9" stroke-linecap="butt"/>`;
  }
  const ghostSvg = ghost == null ? '' :
    `<g transform="rotate(${vuAngle(ghost).toFixed(2)} ${cx} ${cy})"><line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - R + 4}" stroke="var(--prev-mark)" stroke-width="1.6" stroke-dasharray="3 3"/></g>`;
  const needleColor = kind === 'cur' ? 'var(--now)' : 'var(--prev)';
  const glow = kind === 'cur' ? `filter="url(#g-${id})"` : '';
  return `<svg class="vu" viewBox="0 0 160 116" role="img" aria-label="${label}">
    <defs>
      <radialGradient id="f-${id}" cx="50%" cy="8%" r="95%"><stop offset="0" style="stop-color:var(--vu-face-1)"/><stop offset="1" style="stop-color:var(--vu-face-2)"/></radialGradient>

    </defs>
    <rect x="2" y="2" width="156" height="112" rx="12" fill="url(#f-${id})"/>
    <path d="M${ax.toFixed(1)} ${ay.toFixed(1)} A${arcR} ${arcR} 0 0 1 ${bx.toFixed(1)} ${by.toFixed(1)}" fill="none" stroke="var(--vu-tick)" stroke-width="1.2" opacity=".75"/>
    ${bandSvg}${ticks}${ghostSvg}
    <g id="${id}" transform="rotate(${vuAngle(value).toFixed(2)} ${cx} ${cy})"><line x1="${cx}" y1="${cy + 4}" x2="${cx}" y2="${cy - R + 1}" stroke="${needleColor}" stroke-width="2.2" stroke-linecap="round" ${glow}/></g>
    <rect x="2" y="96" width="156" height="18" rx="0" fill="var(--vu-face-2)"/>
    <circle cx="${cx}" cy="${cy}" r="7" fill="var(--wall-3)" stroke="var(--vu-tick)" stroke-width="1" opacity=".95"/>
    <text x="12" y="110" font-family="IBM Plex Mono,ui-monospace,Menlo,monospace" font-size="9" letter-spacing="1.2" fill="var(--vu-label)">ms</text>
    <text x="148" y="110" text-anchor="end" font-family="IBM Plex Mono,ui-monospace,Menlo,monospace" font-size="9" letter-spacing="1.2" fill="var(--vu-label)">VU</text>

/* VU 針の動き(減衰する振動)。from → to、duration ms */
function swingNeedle(el, from, to, dur, delay = 0, overshoot = .9){
  if (!el) return;
  const t0 = performance.now() + delay;
  const step = now => {
    const t = Math.max(0, now - t0) / dur;
    let v;
    if (t >= 1) v = to;
    else { const k = 1 - Math.exp(-5 * t) * Math.cos(t * Math.PI * 2.4 * overshoot); v = from + (to - from) * k; }
    el.setAttribute('transform', `rotate(${vuAngle(v).toFixed(2)} ${VU.cx} ${VU.cy})`);
    if (t < 1) frame(step);
  };
  frame(step);
}

/* ---------- 乱数(全案共通の種)とダミー音列 ---------- */

  const r = mulberry32(20260923);
  return PITCH.map((p, i) => {
    const cur = i === 6 ? 62 : Math.round((r() * 2 - 1) * 10);
    const prev = Math.round((r() * 2 - 1) * 14);
    return { i, p, cur, prev, missed: i === 21 };

/* ---------- 帯の数直線(D10) ---------- */
function bandLine(){

  return `<svg viewBox="0 0 ${W} 52" role="img" aria-label="ばらつきの数直線。前回 14 ミリ秒の揺れの帯は 8 から 20 ミリ秒。今回 13 ミリ秒は帯の中">
    <line x1="${x0}" y1="30" x2="${x1}" y2="30" stroke="var(--text-3)" stroke-width="1" opacity=".6"/>
    <rect x="${X(b0)}" y="15" width="${X(b1) - X(b0)}" height="22" rx="5" fill="var(--band)" stroke="var(--band-edge)" stroke-width="1"/>
    ${ticks}
    <circle cx="${X(D.prevMs)}" cy="26" r="5.5" fill="var(--wall)" stroke="var(--prev)" stroke-width="2"/>
    <circle cx="${X(D.curMs)}" cy="26" r="5.5" fill="var(--now)"/>
    <text x="${X(D.curMs) - 9}" y="11" text-anchor="end" font-size="11.5" font-weight="700" fill="var(--now)">今回 13</text>
    <text x="${X(D.prevMs) + 9}" y="11" font-size="11.5" font-weight="600" fill="var(--prev)">前回 14</text>
    <text x="${X(b1) + 8}" y="30" font-size="11" fill="var(--text-3)">← 揺れの帯 ±${D.noiseBandMs}ms</text>
  </svg>`;
}

/* ---------- 推移(帯付き折れ線) ---------- */
function trendSVG(){
  const tk = [...DATA.takes].reverse();
  const W = 320, H = 150, x0 = 36, x1 = 306, y0 = 16, y1 = 116, vmax = 30;
  const X = i => x0 + i * (x1 - x0) / (tk.length - 1), Y = v => y1 - (Math.max(0, Math.min(vmax, v)) / vmax) * (y1 - y0);
  const bw = D.noiseBandMs;
  const upper = tk.map((t, i) => `${X(i)},${Y(t.ms + bw)}`).join(' ');
  const lower = tk.map((t, i) => `${X(i)},${Y(t.ms - bw)}`).reverse().join(' ');
  let grid = '';
  for (const v of [0, 10, 20, 30]) grid += `<line x1="${x0 - 6}" y1="${Y(v)}" x2="${x1 + 6}" y2="${Y(v)}" stroke="var(--hair)" stroke-width="1"/><text x="${x0 - 12}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--text-3)" font-family="IBM Plex Mono,ui-monospace,Menlo,monospace">${v}</text>`;
  const pts = tk.map((t, i) => {
    const last = i === tk.length - 1;
    return `<circle cx="${X(i)}" cy="${Y(t.ms)}" r="${last ? 6 : 4.5}" fill="${last ? 'var(--text)' : 'var(--wall)'}" stroke="var(--text-2)" stroke-width="2"/>
      <text x="${X(i)}" y="${Y(t.ms) - 11}" text-anchor="middle" font-size="12" font-weight="${last ? 700 : 500}" fill="${last ? 'var(--text)' : 'var(--text-2)'}">${t.ms}</text>
      <text x="${X(i)}" y="${H - 14}" text-anchor="middle" font-size="10.5" fill="var(--text-3)" font-family="IBM Plex Mono,ui-monospace,Menlo,monospace">T${t.no}</text>
      <text x="${X(i)}" y="${H - 1}" text-anchor="middle" font-size="10" fill="var(--text-3)">${t.date}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ばらつきの推移。T1 21、T2 17、T3 15、T4 14、T5 13 ミリ秒。帯は各点の上下 6 ミリ秒">
    ${grid}
    <text x="${x0 - 12}" y="${y0 - 8}" text-anchor="end" font-size="10" fill="var(--text-3)">ms</text>
    <polygon points="${upper} ${lower}" fill="var(--band)" stroke="var(--band-edge)" stroke-width="1"/>
    <polyline points="${tk.map((t, i) => `${X(i)},${Y(t.ms)}`).join(' ')}" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linejoin="round"/>
    ${pts}
  </svg>`;
}

/* ---------- ピアノロール + 拍からのズレ ---------- */
function rollSVG(){
  const W = 326, H = 150, x0 = 10, x1 = 318, top = 26, bot = 142, pMin = 44, pMax = 73;
  const step = (x1 - x0) / 26, pxms = step / D.gridMs;
  const X = (i, ms = 0) => x0 + i * step + step * .5 + ms * pxms, Y = p => bot - (p - pMin) / (pMax - pMin) * (bot - top);
  let g = '';
  for (let b = 0; b <= 26; b += 4){ const x = x0 + b * step; g += `<line x1="${x}" y1="${top - 6}" x2="${x}" y2="${bot + 4}" stroke="var(--hair)" stroke-width="${b % 16 === 0 ? 1.6 : 1}"/>`; if (b < 26) g += `<text x="${x + 3}" y="${top - 10}" font-size="10" fill="var(--text-3)" font-family="IBM Plex Mono,ui-monospace,Menlo,monospace">${(b / 4) % 4 + 1}</text>`; }
  let prev = '', cur = '';
  NOTES.forEach(n => {
    prev += `<rect x="${(X(n.i, n.prev) - 5).toFixed(1)}" y="${(Y(n.p) - 3.5).toFixed(1)}" width="10" height="7" rx="1.5" fill="none" stroke="var(--prev)" stroke-width="1.3"/>`;
    if (n.missed){
      cur += `<rect x="${(X(n.i) - 5).toFixed(1)}" y="${(Y(n.p) - 5).toFixed(1)}" width="10" height="10" rx="2" fill="none" stroke="var(--now)" stroke-width="1.4" stroke-dasharray="2 2"/>`;
    } else {
      cur += `<rect x="${(X(n.i, n.cur) - 3.5).toFixed(1)}" y="${(Y(n.p) - 2.2).toFixed(1)}" width="7" height="4.4" rx="1" fill="var(--now)"/>`;
    }
    if (n.i === 6) cur += `<circle cx="${X(n.i, n.cur).toFixed(1)}" cy="${Y(n.p).toFixed(1)}" r="8.5" fill="none" stroke="var(--now)" stroke-width="1.5"/>`;
  });
  const ex = X(17.5), ey = Y(59);
  cur += `<path d="M${ex} ${ey - 5} L${ex + 5} ${ey} L${ex} ${ey + 5} L${ex - 5} ${ey}Z" fill="none" stroke="var(--now)" stroke-width="1.5"/>`;
  const n7 = NOTES[6], n22 = NOTES[21];
  const lab = `<text x="${X(6) + 12}" y="${Y(n7.p) - 6}" font-size="11" font-weight="700" fill="var(--text)">7 音目 +62ms</text>
    <text x="${ex + 8}" y="${ey + 14}" font-size="11" font-weight="600" fill="var(--text-2)">18 音目 余分</text>
    <text x="${X(21) - 8}" y="${Y(n22.p) + 20}" text-anchor="end" font-size="11" font-weight="600" fill="var(--text-2)">22 音目 弾き忘れ</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="ピアノロール。前回 T5 は枠、今回 T6 は塗り。7 音目が 62 ミリ秒遅れ、18 音目が余分、22 音目が弾き忘れ">${g}${prev}${cur}${lab}</svg>`;
}
function residSVG(){
  const W = 326, H = 118, x0 = 34, x1 = 318, mid = 60, k = 0.62;
  const step = (x1 - x0) / 26, X = i => x0 + i * step + step / 2, Y = ms => mid - ms * k;
  let g = `<rect x="${x0}" y="${Y(13)}" width="${x1 - x0}" height="${26 * k}" fill="var(--band)"/>`;
  for (const v of [50, 0, -50]) g += `<line x1="${x0}" y1="${Y(v)}" x2="${x1}" y2="${Y(v)}" stroke="${v === 0 ? 'var(--text-3)' : 'var(--hair)'}" stroke-width="1" ${v === 0 ? 'opacity=".6"' : ''}/><text x="${x0 - 6}" y="${Y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--text-3)" font-family="IBM Plex Mono,ui-monospace,Menlo,monospace">${v > 0 ? '+' : ''}${v}</text>`;
  let d = '';
  NOTES.forEach(n => {
    d += `<circle cx="${X(n.i).toFixed(1)}" cy="${Y(n.prev).toFixed(1)}" r="2.6" fill="none" stroke="var(--prev)" stroke-width="1.3"/>`;
    if (n.missed) d += `<g stroke="var(--now)" stroke-width="1.5" stroke-linecap="round"><line x1="${X(n.i) - 4}" y1="${mid - 4}" x2="${X(n.i) + 4}" y2="${mid + 4}"/><line x1="${X(n.i) + 4}" y1="${mid - 4}" x2="${X(n.i) - 4}" y2="${mid + 4}"/></g>`;
    else d += `<circle cx="${X(n.i).toFixed(1)}" cy="${Y(n.cur).toFixed(1)}" r="3.2" fill="var(--now)"/>`;
  });
  d += `<line x1="${X(6)}" y1="${mid}" x2="${X(6)}" y2="${Y(62) + 4}" stroke="var(--now)" stroke-width="1.2" stroke-dasharray="2 2"/><text x="${X(6) + 8}" y="${Y(62) + 4}" font-size="11" font-weight="700" fill="var(--text)">+62ms(遅れ)</text>`;
  d += `<text x="${x1}" y="${H - 4}" text-anchor="end" font-size="10.5" fill="var(--text-3)">網 = ばらつき ±13ms の幅</text><text x="${x0}" y="${H - 4}" font-size="10.5" fill="var(--text-3)">↑遅い ↓早い(ms)</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="音ごとの拍からのズレ。ほとんど ±10 ミリ秒以内、7 音目だけ 62 ミリ秒遅れ">${g}${d}</svg>`;
}
function gridSVG(){
  // 16 分格子 1 マス 259ms に対する ±13ms の幅
  const W = 326, H = 44, x0 = 4, x1 = 322, cells = 4, cw = (x1 - x0) / cells, k = cw / D.gridMs;
  let s = '';
  for (let c = 0; c <= cells; c++){ const x = x0 + c * cw; s += `<rect x="${x - 13 * k}" y="8" width="${26 * k}" height="20" rx="2" fill="var(--now)" opacity=".35"/><line x1="${x}" y1="4" x2="${x}" y2="32" stroke="var(--text-2)" stroke-width="1.4"/>`; }
  s += `<text x="${x0 + cw / 2}" y="${H - 1}" text-anchor="middle" font-size="10.5" fill="var(--text-3)">1 マス = 259ms</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="16 分の格子 259 ミリ秒に対して、ばらつき 13 ミリ秒の幅">${s}</svg>`;
}

      <button data-listen="alt" aria-pressed="false">${I.swap}交互に聴く<span class="prog"></span></button>
    </div>
    <p class="listen-status" id="lstat">1 小節ずつ T${p} → T${c} の順に鳴らします</p>
    <p class="note consist">${CONSIST}</p>

    <!-- 下部 -->
    <section class="card roll" id="roll" aria-labelledby="h-roll">
      <div class="h-row"><h2 id="h-roll">ピアノロール</h2><span class="gloss">1〜4 = 拍</span></div>
      ${rollSVG()}
      <div class="legend">
        <span><svg viewBox="0 0 18 12"><rect x="2" y="2" width="14" height="8" rx="1.5" fill="none" stroke="var(--prev)" stroke-width="1.4"/></svg>T${p} 前回(枠)</span>
        <span><svg viewBox="0 0 18 12"><rect x="4" y="3.5" width="10" height="5" rx="1" fill="var(--now)"/></svg>T${c} 今回(塗り)</span>
        <span><svg viewBox="0 0 18 12"><circle cx="9" cy="6" r="5" fill="none" stroke="var(--now)" stroke-width="1.4"/></svg>大きくずれた音</span>
        <span><svg viewBox="0 0 18 12"><path d="M9 1.5L13.5 6 9 10.5 4.5 6z" fill="none" stroke="var(--now)" stroke-width="1.4"/></svg>余分</span>
        <span><svg viewBox="0 0 18 12"><rect x="4" y="1.5" width="10" height="9" rx="2" fill="none" stroke="var(--now)" stroke-width="1.4" stroke-dasharray="2 2"/></svg>弾き忘れ</span>
      </div>
      <h2 style="margin-top:18px;font-size:14.5px;color:var(--text-2)">音ごとの拍からのズレ</h2>
      ${residSVG()}
    </section>

    <section class="card" aria-labelledby="h-grid">
      <div class="h-row"><h2 id="h-grid">拍に対する安定度</h2><span class="gloss">格子ばらつき</span></div>
      <div class="grid-big" aria-label="拍に対する安定度 13 ミリ秒"><span class="n num">13</span><span class="u">ms</span><span class="p">♩=58 の 16 分格子<br>(1 マス 259ms)に対して</span></div>
      ${gridSVG()}
    </section>

    <section class="card" aria-labelledby="h-six">
      <div class="h-row"><h2 id="h-six">6 つの指標</h2><span class="gloss">灰 = 前回 T${p}</span></div>
      <div class="metrics">
        <div class="metric"><div class="k">ばらつき</div><div class="v num">13<small>ms</small></div><div class="p">前回 14 · 横ばい</div></div>
        <div class="metric"><div class="k">音符の一致率</div><div class="v num">92<small>%</small></div><div class="p">前回 83</div></div>
        <div class="metric"><div class="k">弾き忘れ・余分</div><div class="v num">2<small>個</small></div><div class="p">前回 6</div></div>
        <div class="metric"><div class="k">テンポの流れ</div><div class="v num">−0.1<small>%</small></div><div class="p">ほぼ一定</div></div>
        <div class="metric"><div class="k">格子の一致度</div><div class="v num">95<small>%</small></div><div class="p">16 分の格子</div></div>
        <div class="metric"><div class="k">解析した音</div><div class="v num">26<small>音</small></div><div class="p">8 音以上で判定</div></div>
      </div>
      <details class="twin"><summary>表で見る</summary>
        <table class="tw"><thead><tr><th>指標</th><th>T${p}</th><th>T${c}</th><th>判定</th></tr></thead><tbody>
          <tr><td>ばらつき</td><td>14ms</td><td>13ms</td><td>横ばい</td></tr>
          <tr><td>音符の一致率</td><td>83%</td><td>92%</td><td>前回より高い</td></tr>
          <tr><td>弾き忘れ・余分</td><td>6 個</td><td>2 個</td><td>前回より少ない</td></tr>
          <tr><td>テンポの流れ</td><td>—</td><td>−0.1%</td><td>—</td></tr>
          <tr><td>格子の一致度</td><td>—</td><td>95%</td><td>—</td></tr>
          <tr><td>解析した音</td><td>—</td><td>26 音</td><td>—</td></tr>
        </tbody></table>
      </details>
    </section>

    <p class="note note-block">${CONSIST}差が「揺れの帯」の中なら横ばいと書きます。帯の幅は、同じ演奏を繰り返し録って決め直す予定です。</p>

    <div class="dock">
      <button class="btn-rec" data-go="#rec" data-count="1" data-next="1"><span class="dot" aria-hidden="true"></span>もう 1 テイク</button>
      <button class="btn-2" data-go="#home">今日は終了</button>
    </div>
  </main>`;
};
/* =========================================================
   ルーター(history.pushState。Android の戻る = 1 つ前の画面 / シートを閉じる)
   ========================================================= */
const ROUTES = ['home', 'phrase', 'rec', 'diag', 'diag-bottom', 'extra'];
const BOOTH = ['rec', 'extra'];
let current = null, recLive = false, sheetOpen = null, wakeLock = null;
const hashName = () => { const h = location.hash.replace('#', ''); return ROUTES.includes(h) ? h : 'home'; };
const urlFor = h => location.pathname + location.search + h;

function go(hash, opts = {}, replace = false){
  const depth = (history.state && history.state.d) || 0;
  if (replace) history.replaceState({ d: depth }, '', urlFor(hash));
  else history.pushState({ d: depth + 1 }, '', urlFor(hash));
  render(opts);
}
function goBack(parent){
  if (history.state && history.state.d > 0) history.back();
  else go(parent, {}, true);
}
window.addEventListener('popstate', e => {
  if (sheetOpen){ closeSheet(true); return; }
  if (current === 'rec' && recLive){
    // 録音中の戻る: 止めて捨てるか確認する
    history.pushState({ d: ((e.state && e.state.d) || 0) + 1 }, '', urlFor('#rec'));
    confirmLeave();
    return;
  }
  render({});
});

async function lockScreen(on){
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen');
    if (!on && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch (_) { /* モックでは失敗しても無視 */ }
}

function render(opts){
  clearAll(); closeLayer();
  const name = hashName();
  current = name;
  const screen = name === 'diag-bottom' ? 'diag' : name;
  const booth = BOOTH.includes(screen);
  document.documentElement.classList.toggle('booth', booth);
  document.querySelector('meta[name=theme-color]').content = booth ? '#000000' : getComputedStyle(document.documentElement).getPropertyValue('--room').trim();
  lockScreen(booth);
  $('#app').innerHTML = S[screen]();
  window.scrollTo(0, 0);
  bindCommon();
  (MOUNT[screen] || (() => {}))(opts, name);
  if (state.toast) showToast();
}

function bindCommon(){
  $$('[data-go]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation();
    if (b.dataset.next) state.take += 1;
    const target = b.dataset.go;
    go(target, { count: !!b.dataset.count, anim: true });
  }));
  $$('[data-back]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); goBack(b.dataset.back); }));
  $$('[data-sheet]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openSheet(b.dataset.sheet, b.dataset); }));
  const tb = $('#themeBtn');
  if (tb) tb.addEventListener('click', () => {
    const light = document.documentElement.dataset.theme !== 'light';
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
    const q = new URLSearchParams(location.search); light ? q.set('theme', 'light') : q.delete('theme');
    const s = q.toString();
    history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
    render({});
  });
}

/* ---------- 画面ごとの動き ---------- */
const MOUNT = {};
const BEAT = 60000 / 58;

MOUNT.rec = (opts) => {
  const big = $('#bbig'), line = $('#bline'), dots = $$('#beats i'), air = $('#onair'), haze = $('#haze'), timeEl = $('#btime');
  let startedAt = performance.now(), playing = false;
  recLive = true;
  const light = n => dots.forEach((d, i) => { d.classList.toggle('lit', i === n); });
  const play = (t0Sec = 0) => {
    playing = true; air.classList.remove('standby'); haze.classList.remove('off');
    big.classList.remove('count');
    let beat = 0, bar = 1; const t0 = performance.now() - t0Sec * 1000;
    const tick = () => {
      big.textContent = String(beat + 1); big.classList.remove('tick'); void big.offsetWidth; big.classList.add('tick');
      line.textContent = `${bar} 小節目`; light(beat);
      const s = Math.floor((performance.now() - t0) / 1000); timeEl.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      beat = (beat + 1) % 4; if (beat === 0) bar += 1;
    };
    tick(); every(tick, BEAT);
  };
  if (opts.count || ANIM){
    // スレート → カウントイン 4→1 → 「どうぞ」
    air.classList.add('standby'); haze.classList.add('off');
    big.textContent = ''; line.textContent = `テイク ${state.take}、回します`; timeEl.textContent = '0:00'; light(-1);
    let n = 4;
    later(() => {
      big.classList.add('count');
      const cnt = () => {
        if (n === 0){ line.textContent = 'どうぞ'; play(); later(() => { if (line.textContent === 'どうぞ') {} }, 10); return; }
        big.textContent = String(n); big.classList.remove('tick'); void big.offsetWidth; big.classList.add('tick');
        light(4 - n); n -= 1; later(cnt, BEAT);
      };
      cnt();
    }, 1100);
    startedAt = performance.now();
  } else {
    // 直接開いたとき: 演奏中の静止状態(4 小節目 3 拍目、0:14)
    playing = true; startedAt = performance.now() - 14000;
  }
  // 全面タップで止める(1 本指・移動 20px 以内、開始 1.5 秒以内は無視)
  const root = $('[data-screen=rec]'); let down = null;
  root.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; down = { x: e.clientX, y: e.clientY, id: e.pointerId, multi: !e.isPrimary }; });
  root.addEventListener('pointerup', e => {
    if (!down || e.pointerId !== down.id) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
    if (moved > 20 || performance.now() - startedAt < 1500) return;
    recLive = false; go('#extra', { stopped: true }, true);
  });
  $('#bx').addEventListener('click', e => { e.stopPropagation(); confirmLeave(); });
};

function confirmLeave(){
  const L = $('#layer');
  L.innerHTML = `<div class="dlg-scrim"></div><div class="dlg" role="alertdialog" aria-labelledby="dlg-h">
      <h3 id="dlg-h">止めて捨てますか</h3><p>いまのテイク ${state.take} は保存しません。</p>
      <div class="row"><button class="keep" id="dk">続ける</button><button class="drop" id="dd">止めて捨てる</button></div></div>`;
  $('#dk').onclick = () => { L.innerHTML = ''; };
  $('#dd').onclick = () => { L.innerHTML = ''; recLive = false; go('#phrase', {}, true); };
}

MOUNT.extra = (opts) => {
  recLive = false;
  const num = $('#anum'), talk = $('#talk');
  if (opts.stopped || ANIM){
    // 解析の後回しキュー: 数字が出る前でも「もう 1 テイク」は押せる
    num.classList.add('wait'); talk.textContent = '止めました';
    later(() => { num.classList.remove('wait'); num.classList.add('glow'); }, ANIM ? 700 : 900);
  }
  const root = $('[data-screen=extra]'); let down = null;
  root.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  root.addEventListener('pointerup', e => {
    if (!down) return; const dx = e.clientX - down.x, dy = e.clientY - down.y; down = null;
    if (dy > 80 && Math.abs(dx) < 60){ go('#diag', { anim: true }, true); return; }  // 下スワイプ = プレイバック
    if (Math.hypot(dx, dy) <= 20){ state.take += 1; go('#rec', { count: true }, true); } // タップ = もう 1 テイク
  });
  $('#toPlayback').addEventListener('click', e => { e.stopPropagation(); go('#diag', { anim: true }, true); });
  $('#drop').addEventListener('click', e => {
    e.stopPropagation();
    state.toast = { no: state.take, until: Date.now() + 5000 };
    go('#phrase', {}, true);
  });
};

MOUNT.diag = (opts, name) => {
  const nP = $('#nP'), nC = $('#nC');
  const animate = ANIM || opts.anim;
  if (name === 'diag-bottom'){ const r = $('#roll'); window.scrollTo(0, r.getBoundingClientRect().top + window.scrollY - 12); }
  if (animate && !RM){
    // 体験の核: 2 本の針が 0 から前回の位置(14)へ立ち上がり、今回の針だけが 13 へ振れて止まる
    const setA = (el, v) => el.setAttribute('transform', `rotate(${vuAngle(v)} ${VU.cx} ${VU.cy})`);
    setA(nP, 0); setA(nC, 0);
    const cv = $('#curVal'); cv.style.opacity = '0'; cv.style.transition = 'opacity .5s ease';
    const typed = $('#typed'), full = typed.textContent; typed.textContent = '';
    swingNeedle(nP, 0, D.prevMs, 700, 0, .8);
    swingNeedle(nC, 0, D.prevMs, 700, 0, .8);
    later(() => swingNeedle(nC, D.prevMs, D.curMs, 900, 0, 1.1), 750);
    later(() => { cv.style.opacity = '1'; }, 1250);
    let i = 0; later(() => { const t = every(() => { typed.textContent = full.slice(0, ++i); if (i >= full.length) clearInterval(t); }, 38); }, 300);
  }
  // 比べる相手の切替
  $$('[data-mode]').forEach(b => b.addEventListener('click', () => {
    $$('[data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    const note = $('#modeNote');
    if (b.dataset.mode === 'best') note.textContent = 'いちばん安定していたテイクは、直前と同じ T5(14ms)です。表示は変わりません。';
    else if (b.dataset.mode === 'ref') note.textContent = 'リファレンス(お手本)はまだありません。トラック画面で録るか、取り込めます。';
    else note.textContent = '';
  }));
  // 聴き比べ(モックでは再生の見た目だけ)
  const lstat = $('#lstat'); let lt = [];
  const stop = () => { lt.forEach(clearInterval); lt = []; $$('[data-listen]').forEach(x => { x.setAttribute('aria-pressed', 'false'); x.querySelector('.prog').style.width = '0'; }); $('#chP').style.outline = ''; $('#chC').style.outline = ''; };
  $$('[data-listen]').forEach(b => b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') === 'true'; stop(); if (on){ lstat.textContent = '止めました'; return; }
    b.setAttribute('aria-pressed', 'true'); const prog = b.querySelector('.prog'); let t = 0; const total = 4 * 4 * BEAT / 4;
    const kind = b.dataset.listen, p = state.take - 1, c = state.take;
    const iv = setInterval(() => {
      t += 100; prog.style.width = Math.min(100, t / total * 100) + '%';
      if (kind === 'alt'){
        const bar = Math.floor(t / (4 * BEAT / 2)) % 2; // 見た目のため 2 拍ごとに切替
        $('#chP').style.outline = bar === 0 ? '2px solid var(--prev)' : ''; $('#chC').style.outline = bar === 1 ? '2px solid var(--now)' : '';
        lstat.textContent = `交互に再生中 · いま ${bar === 0 ? 'T' + p + '(前回)' : 'T' + c + '(今回)'}`;
      } else lstat.textContent = `${kind === 'p' ? 'T' + p + '(前回)' : 'T' + c + '(今回)'} を再生中`;
      if (t >= total){ stop(); lstat.textContent = '最後まで再生しました'; }
    }, 100); lt.push(iv); timers.push(iv);
  }));
};

/* ---------- シート(履歴に積む) ---------- */
function openSheet(kind, ds = {}){
  history.pushState({ d: ((history.state && history.state.d) || 0) + 1, sheet: kind }, '', location.href);
  sheetOpen = kind;
  let body = '';
  if (kind === 'take'){
    const t = DATA.takes.find(x => String(x.no) === ds.no) || DATA.takes[0];
    body = `<h3>T${t.no} · ${t.date}</h3><p class="sub">ばらつき ${t.ms}ms · 一致率 ${t.match}% · 忘れ・余分 ${t.missExtra} 個</p>
      <button class="opt" data-close>${'<span class="ic">▶</span>'}<span>聴く</span></button>
      <button class="opt" data-close><span class="ic">★</span><span>リファレンスにする<small>次のテイクから、お手本として並べます</small></span></button>
      <button class="opt" id="optDrop" data-no="${t.no}"><span class="ic">✕</span><span>キープしない(捨てる)<small>捨てた直後の 5 秒は戻せます</small></span></button>`;
  } else if (kind === 'settings'){
    body = `<h3>TR1 の設定</h3><p class="sub">録音の前に 1 回だけ。ブースの中には出しません</p>
      <div class="set-row"><span class="k">テンポ<small>メトロノーム + カウントイン 1 小節</small></span><span class="stepper"><button aria-label="テンポを下げる">−</button><output class="num">♩=58</output><button aria-label="テンポを上げる">+</button></span></div>
      <div class="set-row"><span class="k">最小の音価</span><div class="seg" style="width:190px"><button aria-pressed="false">8分</button><button aria-pressed="true">16分</button><button aria-pressed="false">3連</button></div></div>
      <div class="set-row"><span class="k">最低音<small>変則調弦のとき</small></span><div class="seg" style="width:190px"><button aria-pressed="true">E</button><button aria-pressed="false">D</button><button aria-pressed="false">C</button></div></div>
      <button class="btn-2" style="width:100%;margin-top:12px" data-close>閉じる</button>`;
  } else if (kind === 'resolve'){
    body = `<h3>TR1 を OK テイクにしますか</h3><p class="sub">同じ弾き方 4/5。決めるのはあなたです。弾いてみた感じで選んでください</p>
      <button class="opt" data-close><span class="ic">✓</span><span>はい、OK テイクにする</span></button>
      <button class="opt" data-close><span class="ic">…</span><span>いいえ、まだ回す</span></button>
      <button class="opt" data-close><span class="ic">?</span><span>わからない<small>いまは決めずにおきます</small></span></button>`;
  } else if (kind === 'resolved'){
    body = `<h3>OK テイクにしたトラック</h3><p class="sub">ときどき回すと、いまの自分と並べられます</p>` +
      DATA.resolved.map(r => `<button class="opt" data-close><span class="ic mono" style="font-size:11px">OK</span><span>${r.name}<small>${r.resolvedAt} に OK · ${r.ms}ms · ${r.lastPlayed ? '最後に回したのは ' + r.lastPlayed : 'その後はまだ回していません'}</small></span></button>`).join('');
  }
  $('#layer').innerHTML = `<div class="scrim" data-close></div><div class="bsheet" role="dialog" aria-modal="true"><div class="grab"></div>${body}</div>`;
  $$('#layer [data-close]').forEach(b => b.addEventListener('click', () => history.back()));
  $$('#layer .seg button').forEach(b => b.addEventListener('click', () => $$('button', b.parentNode).forEach(x => x.setAttribute('aria-pressed', String(x === b)))));
  const od = $('#optDrop');
  if (od) od.addEventListener('click', () => { state.discarded = Number(od.dataset.no); state.toast = { no: state.discarded, until: Date.now() + 5000, fromSheet: true }; history.back(); later(() => render({}), 30); });
}
function closeSheet(){ sheetOpen = null; closeLayer(); }
function closeLayer(){ const L = $('#layer'); if (L) L.innerHTML = ''; }

function showToast(){
  const t = state.toast; if (!t) return;
  const left = t.until - Date.now(); if (left <= 0){ state.toast = null; return; }
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span>テイク ${t.no} を捨てました。<br><span style="opacity:.8">5 秒以内なら戻せます</span></span><button class="btn-3">戻す</button><span class="bar" style="animation-duration:${left}ms"></span>`;
  document.body.appendChild(el);
  el.querySelector('button').onclick = () => { state.discarded = null; state.toast = null; el.remove(); render({}); };
  later(() => { el.remove(); state.toast = null; }, left);
  const obs = new MutationObserver(() => { if (!document.body.contains(el)) obs.disconnect(); });
}

/* ---------- 開発用トグル ---------- */
function devPanel(){
  const d = document.createElement('nav'); d.className = 'dev'; d.setAttribute('aria-label', '開発用(撮影時は ?chrome=0 で隠す)');
  d.innerHTML = ['home', 'phrase', 'rec', 'extra', 'diag', 'diag-bottom'].map(h => `<button data-h="#${h}">#${h}</button>`).join('') + '<button data-t>theme</button><button data-a>anim</button>';
  d.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.h){ $$('.toast').forEach(x => x.remove()); go(b.dataset.h, {}); }
    if (b.dataset.t !== undefined){ document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; render({}); }
    if (b.dataset.a !== undefined){ render({ anim: true, stopped: true, count: true }); }
  });
  document.body.appendChild(d);
}

history.replaceState({ d: 0 }, '', location.href);
devPanel();
render({});
</script>
